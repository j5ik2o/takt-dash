[package]
name = "takt-dash-backend"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "takt-dash-backend"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "time",
  "sync",
  "signal",
] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"
