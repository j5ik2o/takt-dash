name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR. A new head, a reopen, or a base change cancels the older run.
# A title or body edit does not cancel: it waits behind the running run, and a
# burst of edits collapses into one pending run. It still runs the full CI
# because a skipped required job would count as passing. Pushes to main and
# manual re-runs get their own group and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && !github.event.changes.base) }}

jobs:
  ci-revision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Fetch the PR test merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          # An edited event can carry the test merge from before a base change.
          ref: ${{ github.event.action == 'edited' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          persist-credentials: false
      - name: Verify the CI revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          revision="$EVENT_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            revision=$(git rev-parse HEAD)
            # Read raw parent headers even with a shallow checkout.
            parents=$(git cat-file commit "$revision" | sed -n '1,/^$/{s/^parent //p;}')
            printf 'Test merge %s\nEvent base %s\nEvent head %s\nActual parents:\n%s\n' "$revision" "$BASE_SHA" "$HEAD_SHA" "$parents"
            if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$parents" != "$BASE_SHA"$'\n'"$HEAD_SHA" ]]; then
              echo '::error::The test merge does not have the event base and head as its ordered parents.'
              exit 1
            fi
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The CI revision is missing or invalid.'
            exit 1
          fi
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  done:
    needs: ci-revision
    if: needs.ci-revision.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ci-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install pyyaml
      - run: make done
      - run: npm ci
      - run: node scripts/aislop-check-bootstrap.mjs check

  e2e:
    needs: ci-revision
    if: needs.ci-revision.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ci-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make e2e

  # Every Quint spec under specs/quint/ is typechecked, its *_test.qnt runs are
  # executed, and its README-specified invariants are simulated by
  # scripts/quint-check-specs.sh. This checks the specs themselves and their
  # consistency with specs/quint/ci-specs.json and each spec's README; whether
  # the Rust/Web implementation preserves those properties is checked by the
  # tests in `done` and `e2e`. Design: docs/design/quint-ci.md.
  quint:
    needs: ci-revision
    if: needs.ci-revision.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ci-revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      # quint's default backend is a Rust evaluator that quint downloads on first
      # use through the unauthenticated GitHub releases API (first page only).
      # The evaluator is cached here and fetched with the job token on a cache
      # miss, so quint finds it and never calls the unauthenticated API. Release
      # assets are mutable, so both the archive and executable are verified
      # against sha256 digests pinned per evaluator version.
      - name: Rust evaluator version
        id: evaluator
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::the evaluator digests below are for x86_64 Linux, not $RUNNER_OS $RUNNER_ARCH"
            exit 1
          fi
          version=$(node -p "require('@informalsystems/quint/dist/src/rust/binaryManager.js').QUINT_EVALUATOR_VERSION")
          case $version in
            v0.6.0)
              archive_sha256=61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2
              executable_sha256=b2efdeac5713d153e41bf2143b94ed75d888fdd5637f4a5d61a04c695313510a
              ;;
            *)
              echo "::error::no pinned digests for Rust evaluator $version; add them to ci.yml"
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "dir=$HOME/.quint/rust-evaluator-$version"
            echo "archive_sha256=$archive_sha256"
            echo "executable_sha256=$executable_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: evaluator_cache
        with:
          path: ${{ steps.evaluator.outputs.dir }}
          key: quint-evaluator-${{ runner.os }}-${{ runner.arch }}-${{ steps.evaluator.outputs.version }}-${{ steps.evaluator.outputs.executable_sha256 }}
      - name: fetch the Rust evaluator
        if: steps.evaluator_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.evaluator.outputs.version }}
          DIR: ${{ steps.evaluator.outputs.dir }}
          ARCHIVE_SHA256: ${{ steps.evaluator.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quint_evaluator.tar.gz"
          gh release download "evaluator/$VERSION" --repo informalsystems/quint \
            --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$DIR"
          tar -xzf "$archive" -C "$DIR"
      - name: check the Rust evaluator
        env:
          DIR: ${{ steps.evaluator.outputs.dir }}
          EXECUTABLE_SHA256: ${{ steps.evaluator.outputs.executable_sha256 }}
        run: |
          set -euo pipefail
          test -x "$DIR/quint_evaluator"
          echo "$EXECUTABLE_SHA256  $DIR/quint_evaluator" | sha256sum -c -
      - name: check Quint specs
        run: bash scripts/quint-check-specs.sh

  required-ci:
    name: takt-dash required CI
    needs: [ci-revision, done, e2e, quint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
      - name: Require all blocking jobs to succeed
        env:
          REVISION_RESULT: ${{ needs.ci-revision.result }}
          DONE_RESULT: ${{ needs.done.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          QUINT_RESULT: ${{ needs.quint.result }}
        run: |
          printf 'ci-revision=%s done=%s e2e=%s quint=%s\n' "$REVISION_RESULT" "$DONE_RESULT" "$E2E_RESULT" "$QUINT_RESULT"
          if [[ "$REVISION_RESULT" != success || "$DONE_RESULT" != success || "$E2E_RESULT" != success || "$QUINT_RESULT" != success ]]; then
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup component add llvm-tools-preview
      - run: cargo llvm-cov --version > /dev/null 2>&1 || cargo install cargo-llvm-cov --locked
      - run: python3 -m pip install pyyaml coverage
      - run: make coverage
