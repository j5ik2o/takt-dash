name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR. A new head, a reopen, or a base change cancels the older run.
# A title or body edit does not cancel: it waits behind the running run, and a
# burst of edits collapses into one pending run. It still runs the full CI
# because a skipped required job would count as passing. Pushes to main and
# manual re-runs get their own group and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && !github.event.changes.base) }}

jobs:
  ci-revision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Fetch the PR test merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          # An edited event can carry the test merge from before a base change.
          ref: ${{ github.event.action == 'edited' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          persist-credentials: false
      - name: Verify the CI revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          revision="$EVENT_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            revision=$(git rev-parse HEAD)
            # Read raw parent headers even with a shallow checkout.
            parents=$(git cat-file commit "$revision" | sed -n '1,/^$/{s/^parent //p;}')
            printf 'Test merge %s\nEvent base %s\nEvent head %s\nActual parents:\n%s\n' "$revision" "$BASE_SHA" "$HEAD_SHA" "$parents"
            if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$parents" != "$BASE_SHA"$'\n'"$HEAD_SHA" ]]; then
              echo '::error::The test merge does not have the event base and head as its ordered parents.'
              exit 1
            fi
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The CI revision is missing or invalid.'
            exit 1
          fi
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  done:
    needs: ci-revision
    if: needs.ci-revision.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ci-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install pyyaml
      - run: make done
      - run: npm ci
      - run: node scripts/aislop-check-bootstrap.mjs check

  e2e:
    needs: ci-revision
    if: needs.ci-revision.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ci-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make e2e

  required-ci:
    name: takt-dash required CI
    needs: [ci-revision, done, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
      - name: Require all blocking jobs to succeed
        env:
          REVISION_RESULT: ${{ needs.ci-revision.result }}
          DONE_RESULT: ${{ needs.done.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'ci-revision=%s done=%s e2e=%s\n' "$REVISION_RESULT" "$DONE_RESULT" "$E2E_RESULT"
          if [[ "$REVISION_RESULT" != success || "$DONE_RESULT" != success || "$E2E_RESULT" != success ]]; then
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup component add llvm-tools-preview
      - run: cargo llvm-cov --version > /dev/null 2>&1 || cargo install cargo-llvm-cov --locked
      - run: python3 -m pip install pyyaml coverage
      - run: make coverage
