<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taktDash</title>
<style>
:root{--bg:#f6f8f8;--surface:#fff;--line:#e3e7e8;--line2:#eef1f2;--text:#262b30;--muted:#646c73;--faint:#9aa1a7;--teal:#0f8b8d;--teal-d:#0b6466;--teal-soft:#e2f3f3;--track:#e9eef0;--orange:#d9661a;--orange-d:#9a4510;--orange-soft:#fdf1e7;--orange-line:#f2c39d;--gray-soft:#f0f2f3;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal-d)}
.sr{position:absolute;left:-9999px}
/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;z-index:5}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-size:21px;font-weight:700;text-decoration:none;color:var(--text)}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--teal);color:#fff;font-size:15px;display:grid;place-items:center;font-weight:700}
.logo span b{color:var(--teal)}
.side h2{font-size:12px;letter-spacing:.08em;color:var(--faint);margin:14px 8px 6px;font-weight:700}
.srv-list,.nav{list-style:none;margin:0;padding:0}
.srv-list a,.nav a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px}
.srv-list a:hover,.nav a:hover{background:var(--gray-soft)}
.srv-list a.on,.nav a.on{background:var(--teal-soft);color:var(--teal-d);font-weight:700}
.srv-list .nm{flex:1;min-width:0}
.srv-list .nm b{display:block;font-weight:600;overflow-wrap:anywhere;font-size:13.5px}
.srv-list .nm small{display:block;font-size:13px;color:var(--muted)}
.srv-list .nm small.warn{color:var(--orange-d);font-weight:600}
.srv-list .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.nav .badge{margin-left:auto;font-size:12px;background:var(--orange-soft);color:var(--orange-d);border:1px solid var(--orange-line);border-radius:999px;padding:0 8px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.side .foot b{color:var(--text);font-weight:600}
/* dots */
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.live{background:var(--teal);box-shadow:0 0 0 0 rgba(15,139,141,.45);animation:pulse 2.4s ease-in-out infinite}
.dot.idle{background:#b5bbc0}
.dot.warn{background:var(--orange)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,139,141,.5)}70%{box-shadow:0 0 0 7px rgba(15,139,141,0)}100%{box-shadow:0 0 0 0 rgba(15,139,141,0)}}
/* main */
.main{margin-left:252px;padding:28px 36px 48px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:26px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.health{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;padding:8px 14px;border-radius:8px;max-width:100%}
.health.attention{background:var(--orange-soft);color:var(--orange-d);border:1px solid var(--orange-line)}
.health.calm{background:var(--teal-soft);color:var(--teal-d);border:1px solid #bfe2e2}
section{margin-top:28px}
h2.sec{font-size:16px;margin:0 0 12px}
h2.sec .sub{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
.note{font-size:14px;color:var(--muted)}
.en{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:4px;font-weight:400}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.tile.attention{border-color:var(--orange-line);background:linear-gradient(0deg,#fffaf5,#fff)}
.tile .label{color:var(--muted);font-size:14px}
.tile .num{font-size:32px;font-weight:700;line-height:1.25;margin:4px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .num small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.tile.attention .num{color:var(--orange)}
.tile .num.word{font-size:22px;line-height:1.5;padding:6px 0}
.tile .t-note{font-size:14px;color:var(--muted)}
.tile .t-note.warn{color:var(--orange-d);font-weight:600}
.kv{list-style:none;margin:6px 0 0;padding:0;font-size:14px;color:var(--muted)}
.kv li{display:flex;justify-content:space-between;gap:8px}
.kv li b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kv li b.warn{color:var(--orange)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:4px}
.bar.thick{height:12px;border-radius:6px}
.bar.live>i{background-color:var(--teal);background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:24px 24px;animation:flow 1.6s linear infinite}
.bar.idle>i{background:#b5bbc0}
.bar.warn>i{background:var(--orange)}
@keyframes flow{from{background-position:0 0}to{background-position:24px 0}}
/* callout */
.callout{background:var(--surface);border:1px solid var(--orange-line);border-left:5px solid var(--orange);border-radius:12px;padding:14px 20px}
.callout h2{margin:0 0 6px;font-size:16px;color:var(--orange-d)}
.callout ul{margin:0;padding:0;list-style:none}
.callout li{display:flex;gap:6px 14px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line2);font-size:15px}
.callout li:first-child{border-top:none}
.callout li .w{color:var(--orange-d);font-weight:600;white-space:nowrap}
.callout li .s{color:var(--muted);font-size:14px;white-space:nowrap}
/* server cards */
.scards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scard.down{border-color:var(--orange-line);background:#fffcf9}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sc-head h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere;min-width:0}
.sc-head .kind{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-left:20px}
.big-badge{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding:5px 14px;border-radius:999px;white-space:nowrap}
.big-badge.live{background:var(--teal-soft);color:var(--teal-d)}
.big-badge.idle{background:var(--gray-soft);color:var(--muted)}
.big-badge.warn{background:var(--orange-soft);color:var(--orange-d);border:1px solid var(--orange-line)}
.stale-note{font-size:14px;color:var(--orange-d);background:var(--orange-soft);border-radius:8px;padding:6px 10px}
.read-at{font-size:13px;color:var(--muted)}
.runs{list-style:none;margin:0;padding:0}
.run-row{display:grid;grid-template-columns:96px minmax(0,1fr) 200px;gap:4px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.run-row:first-child{border-top:none}
.st{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.35}
.st.live{color:var(--teal-d)}.st.idle{color:var(--muted)}.st.warn{color:var(--orange-d)}
.run-main{min-width:0}
.run-main .p{font-weight:700}
.run-main .g{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.run-main .task{font-size:14px;overflow-wrap:anywhere}
.run-main .model{font-size:13px;color:var(--muted)}
.run-prog{min-width:0}
.run-prog .stp{font-size:14px;overflow-wrap:anywhere}
.run-prog .stp b{font-family:var(--mono);font-size:14px}
.run-prog .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.run-prog .meta a{font-weight:600;text-decoration:none;white-space:nowrap}
.run-prog .meta a:hover{text-decoration:underline}
.run-prog .meta .warn{color:var(--orange-d);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sc-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sc-foot b{display:block;font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.sc-foot b.warn{color:var(--orange)}
.sc-foot b.quiet{color:var(--faint)}
.filter-note{font-size:14px;margin:-8px 0 14px}
/* tray */
.tray{background:var(--surface);border:1px solid var(--orange-line);border-left:5px solid var(--orange);border-radius:12px;padding:18px 22px}
.tray-list{list-style:none;margin:0;padding:0}
.tray-item{display:grid;grid-template-columns:220px minmax(0,1fr) 170px 100px;gap:8px 22px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.tray-item:first-child{border-top:none;padding-top:4px}
.tray-item .proj{font-weight:700;overflow-wrap:anywhere}
.tray-item .kind,.tray-item .srv{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.tray-item .kind.k{color:var(--orange-d);font-weight:600}
.tray-item .desc{margin:0}
.tray-item .opts{font-size:14px;color:var(--muted)}
.tray-item .url{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere;font-family:var(--mono)}
.tray-item .wait{font-size:14px;color:var(--muted)}
.tray-item .wait b{display:block;font-size:16px;color:var(--text)}
.tray-item.stale .wait b{color:var(--orange)}
.tray-item .wait .stale-label{color:var(--orange-d);font-weight:600}
a.view{color:var(--teal-d);font-weight:600;text-decoration:none;white-space:nowrap}
a.view:hover{text-decoration:underline}
.foot-notes{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.foot-notes p{margin:2px 0}
.quiet-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
/* project cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.attention{border-color:var(--orange-line)}
.card.paused{background:#fbfbfb}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:17px;overflow-wrap:anywhere}
.card-head .about{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.live{color:var(--teal-d);background:var(--teal-soft)}
.pill.warn{color:var(--orange-d);background:var(--orange-soft);font-weight:600}
.pill.idle{color:var(--muted);background:var(--gray-soft)}
.k{font-size:14px;color:var(--muted)}
.goal{padding:8px 0;border-top:1px dashed var(--line)}
.goal:first-of-type{border-top:none}
.goal .gn{font-weight:600}
.goal .gs{font-size:13px;color:var(--muted)}
.goal .gs .warn{color:var(--orange-d);font-weight:600}
.goal .pt{font-size:14px;color:var(--muted)}
.goal .why{font-size:14px;color:var(--muted);background:var(--gray-soft);border-radius:8px;padding:6px 10px;margin-top:6px}
.mini-runs{list-style:none;margin:0;padding:0}
.mini-runs li{padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.mini-runs li:first-child{border-top:none}
.mini-runs .r1{display:flex;align-items:center;gap:8px;min-width:0}
.mini-runs .r1 .tn{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mini-runs .r2{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;padding-left:18px}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding-top:10px;border-top:1px solid var(--line)}
.meta2 .v{font-size:15px}.meta2 .v.quiet{color:var(--muted)}.meta2 .v.warn{color:var(--orange);font-weight:700}
.last{font-size:14px;color:var(--muted)}
.last time{color:var(--text);font-variant-numeric:tabular-nums;margin-right:6px}
/* chips & filters */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:3px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:#9fd3d3;color:var(--teal-d);font-weight:700}
.chip.warnc[aria-pressed="true"]{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange-d)}
.search{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%;max-width:420px;background:#fff;color:var(--text)}
/* activity */
.daychart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.daychart .cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;height:170px;margin-top:8px}
.daychart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.daychart .stack{width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 2px 2px;overflow:hidden}
.daychart .stack i{display:block;background:var(--teal)}
.daychart .stack i.w{background:var(--orange)}
.daychart .n{font-size:13px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.3}
.daychart .n small{display:block;font-weight:400;color:var(--orange-d)}
.daychart .d{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--teal);margin-right:6px;vertical-align:-1px}
.legend span.w::before{background:var(--orange)}
.days{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;background:#f9fafa;padding:9px 18px;font-size:14px;font-weight:700;border-top:1px solid var(--line)}
.day-h:first-child{border-top:none}
.day-h span{color:var(--muted);font-weight:400}
.ev{display:grid;grid-template-columns:56px 150px minmax(0,1fr) 200px 110px;gap:4px 14px;padding:10px 18px;border-top:1px solid var(--line2);align-items:baseline;font-size:14px}
.ev time{font-family:var(--mono);color:var(--muted)}
.ev .kl{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.ev .kl.warn{color:var(--orange-d)}
.ev .msg{font-size:15px;overflow-wrap:anywhere}
.ev .msg b{font-weight:700}
.ev .sv{color:var(--muted);overflow-wrap:anywhere}
.ev .lk{text-align:right}
.ev .lk a{font-weight:600;text-decoration:none;white-space:nowrap}
/* run detail */
.back{display:inline-block;margin-bottom:10px;font-size:14px;font-weight:600;text-decoration:none}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.sum-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px}
.sum-grid .f{min-width:0}
.sum-grid .f .v{font-size:15px;overflow-wrap:anywhere}
.sum-grid .f .v.mono{font-family:var(--mono);font-size:13px}
.sum-grid .f.wide{grid-column:span 2}
.src{font-size:12px;color:var(--faint)}
.steps-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.stepchip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted)}
.stepchip.done{background:var(--gray-soft)}
.stepchip.cur{border-color:#9fd3d3;background:var(--teal-soft);color:var(--teal-d);font-weight:700}
.files{font-family:var(--mono);font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.files li{overflow-wrap:anywhere}
.log{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.log-step{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#f4f8f8;border-top:1px solid var(--line);padding:9px 18px;font-size:14px;font-weight:700;color:var(--teal-d)}
.log-step:first-child{border-top:none}
.log-step span{font-weight:400;color:var(--muted)}
.rec{display:grid;grid-template-columns:76px 170px minmax(0,1fr);gap:4px 16px;padding:10px 18px;border-top:1px solid var(--line2);font-size:14px}
.rec.err{background:#fff8f2;border-left:4px solid var(--orange);padding-left:14px}
.rec time{font-family:var(--mono);color:var(--muted);font-size:13px}
.rec .rk{font-weight:600}
.rec .rk small{display:block;font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400}
.rec.err .rk{color:var(--orange-d)}
.rec .rb{min-width:0;overflow-wrap:anywhere}
.rec .rb p{margin:0}
.rec .rb .from{font-size:12px;color:var(--faint)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--teal-d);font-size:13px;font-weight:600}
pre{margin:6px 0 0;background:#f6f8f9;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#2b3237;max-height:360px;overflow:auto}
.count-line{font-size:14px;color:var(--muted);margin:10px 0 8px}
footer{margin-top:28px;font-size:13px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.dot.live,.bar.live>i{animation:none}}
@media (max-width:1280px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.scards{grid-template-columns:minmax(0,1fr)}.tray-item{grid-template-columns:170px minmax(0,1fr) 140px}.tray-item .lc{grid-column:2/4}.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ev{grid-template-columns:52px 130px minmax(0,1fr) 110px}.ev .sv{grid-column:3}.ev .lk{grid-row:1;grid-column:4}}
@media (max-width:760px){
 .side{position:static;width:auto;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px 8px;overflow:visible}
 .logo{padding:0 0 8px}
 .side h2{display:none}
 .srv-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
 .srv-list li{flex:none}
 .srv-list a{border:1px solid var(--line);padding:6px 10px;gap:8px}
 .srv-list .nm b{max-width:150px}
 .srv-list .cnt{display:none}
 .nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
 .nav li{flex:none}.nav a{padding:6px 10px}
 .side .foot{border-top:none;padding:6px 0 0;margin:0}
 .main{margin-left:0;padding:18px 14px 36px}
 .page-head h1{font-size:22px}
 .health{font-size:14px;width:100%}
 .tiles{grid-template-columns:minmax(0,1fr);gap:12px}
 .cards{grid-template-columns:minmax(0,1fr)}
 .scard{padding:16px}
 .run-row{grid-template-columns:minmax(0,1fr);gap:6px}
 .sc-foot{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tray{padding:14px 16px}.tray-item{grid-template-columns:minmax(0,1fr);gap:6px}.tray-item .lc{grid-column:auto}.tray-item .wait b{display:inline;margin-right:6px}

    case "step_start": body = `ステップ ${r.step} を ${r.persona} が始めました（反復 ${r.iteration} 回目${r.model ? `、${r.provider} / ${r.model}` : ""}）。`; if (r.instruction) det("指示を見る", r.instruction); break;
    case "step_complete": err = !!r.error || r.status === "error"; body = `ステップ ${r.step} が ${r.status} で終わりました${r.matchedRuleIndex != null ? `（ルール ${r.matchedRuleIndex} 番に一致、${r.matchedRuleMethod}）` : ""}。`; det("本文を見る", r.content); if (r.instruction) det("指示を見る", r.instruction); if (r.error) det("エラーを見る", r.error); break;
    case "phase_start": body = `フェーズ ${r.phase}（${PHASE_JA[r.phaseName]}）を始めました。`; break;
    case "phase_complete": err = !!r.error || r.status === "error"; body = `フェーズ ${r.phase}（${PHASE_JA[r.phaseName]}）が ${r.status} で終わりました。`; if (r.content) det("本文を見る", r.content); if (r.error) det("エラーを見る", r.error); break;
    case "phase_judge_stage": err = r.status === "error"; body = `判定の段階 ${r.stage}（${r.method}）が ${r.status} でした。`; det("判定の指示と応答を見る", { instruction: r.instruction, response: r.response }); break;
    case "init": body = `プロバイダー ${r.provider} のセッションを始めました（モデル ${d.model}）。`; break;
    case "thinking": body = "エージェントが考えています。"; det("思考の内容を見る", d.thinking); break;
    case "text": body = d.text; break;
    case "result": err = d.success === false; body = d.success ? "エージェントの応答が成功で終わりました。" : `エージェントの応答が失敗で終わりました。${d.error || ""}`; det("応答の本文を見る", d.result); break;
    case "tool_use": { const hint = d.input && (d.input.command || d.input.file_path || d.input.filePath || d.input.pattern); body = `ツール ${d.tool} を呼び出しました${hint ? `。対象は「${hint}」です` : ""}。`; } det("入力を見る", d.input); break;
    case "tool_result": err = d.isError === true; body = err ? "ツールがエラーを返しました。" : "ツールの結果が返りました。"; det(err ? "エラーの内容を見る" : "結果を見る", d.content, err); break;
    case "tool_output": body = `ツール ${d.tool} が出力しました。`; det("出力を見る", d.output); break;
    case "error": case "assistant_error": err = true; body = d.message || d.error; det("エラーの内容を見る", d, true); break;
    case "rate_limit": err = d.status === "rejected"; body = `利用制限の状態は ${d.status} です。`; break;
    case "usage": body = r.usage_missing ? `トークン数は記録されていません（${r.reason}）。` : `トークンを使いました。入力は ${r.usage.input_tokens.toLocaleString()}、出力は ${r.usage.output_tokens.toLocaleString()}、合計は ${r.usage.total_tokens.toLocaleString()} です。`; break;
    default: body = "この種類のレコードは表示の対象外です。";
  }
  const ts = r.timestamp || r.startTime || r.endTime;
  return { disc, label: k[0], cat: err ? "error" : k[1], err, body, details, ts, step: r.step || null, iteration: r.iteration };
}

  const dayLabel = (ms) => { const p = jstParts(ms); return `${p.mo}月${p.d}日（${wd[p.wd]}）`; };
  const groups = [];
  filtered.forEach(e => { const p = jstParts(T(e.at)), key = `${p.y}-${p.mo}-${p.d}`; let g = groups.find(x => x.key === key); if (!g) groups.push(g = { key, label: dayLabel(T(e.at)), items: [] }); g.items.push(e); });
  $("main").innerHTML = `
    <div class="page-head"><div><h1>アクティビティ</h1><p>全サーバーで起きた出来事を、新しいものから並べています。ゴールの通知と問い合わせ、タスクの状態の変化は takt-mcp から読み、接続の出来事は taktDash が記録しています。</p></div>${healthLine()}</div>
    <div class="tiles">
      <div class="tile"><div class="label">今日の出来事</div><div class="num">${today.total}<small>件</small></div><div class="t-note">直近7日では ${weekTotal}件です。</div></div>
      <div class="tile ${today.attention ? "attention" : ""}"><div class="label">今日の判断待ちと異常の出来事</div><div class="num">${today.attention}<small>件</small></div><div class="t-note">問い合わせ、マージ待ち、応答なしを数えています。</div></div>
      <div class="tile"><div class="label">残っている失敗したタスク</div><div class="num">${failedTotal}<small>件</small></div><div class="t-note">失敗・上限超過・PR作成失敗の合計です。</div></div>
      <div class="tile"><div class="label">今日いちばん出来事が多いサーバー</div><div class="num word">${esc(srvName(topSrv[0]))}</div><div class="t-note">今日は ${topSrv[1]}件の出来事がありました。</div></div>
    </div>
    <section class="daychart" aria-labelledby="h-day"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 class="sec" id="h-day" style="margin:0">日ごとの出来事</h2><div class="legend"><span>出来事</span><span class="w">判断待ちと異常</span></div></div>
      <div class="cols">${DAYS.map(d => { const ms = T(d.d + "T03:00:00Z"), p = jstParts(ms); const h = Math.max(4, Math.round(d.total / max * 110)); const wH = d.attention ? Math.max(4, Math.round(d.attention / max * 110)) : 0;
        return `<div class="col"><div class="n">${d.total}件${d.attention ? `<small>うち ${d.attention}件</small>` : ""}</div><div class="stack" style="height:${h}px" role="img" aria-label="${p.mo}月${p.d}日は ${d.total}件、うち判断待ちと異常が ${d.attention}件"><i class="w" style="height:${wH}px"></i><i style="flex:1"></i></div><div class="d">${p.mo}/${p.d}</div></div>`; }).join("")}</div></section>
    <section class="filters" aria-label="絞り込み">
      <div class="chips"><span class="lbl">種類</span>${[["all", "すべて", EVENTS.length], ...Object.keys(EV_KIND).filter(k => kc[k]).map(k => [k, EV_KIND[k][0], kc[k]])].map(([k, ja, n]) => `<button type="button" class="chip ${EV_KIND[k]?.[1] === "warn" ? "warnc" : ""}" data-kind="${k}" aria-pressed="${actState.kind === k}">${ja}<b>${n}</b></button>`).join("")}</div>
      <div class="chips"><span class="lbl">サーバー</span>${[["all", "すべて", EVENTS.length], ...SERVERS.map(s => [s.id, s.name, sc[s.id] || 0])].map(([k, ja, n]) => `<button type="button" class="chip" data-server="${k}" aria-pressed="${actState.server === k}">${esc(ja)}<b>${n}</b></button>`).join("")}</div>
      <input class="search" id="act-q" type="search" placeholder="文やプロジェクト名で探します" value="${esc(actState.q)}" aria-label="出来事を文字で探す">
    </section>
    <p class="count-line">読み込んだ ${EVENTS.length}件のうち ${filtered.length}件を表示しています。日ごとの件数は全件の数です。</p>
    <div class="days">${groups.length ? groups.map(g => `<div class="day-h">${g.label}<span>${g.items.length}件</span></div>${g.items.map(e => { const k = EV_KIND[e.kind]; return `<div class="ev"><time>${hm(e.at)}</time><span class="kl ${k[1] === "warn" ? "warn" : ""}"><span class="dot ${k[1]}" style="animation:none" aria-hidden="true"></span>${k[0]}</span><span class="msg">${e.project ? `<b>${esc(e.project)}</b>：` : ""}${esc(e.text)}</span><span class="sv">${esc(srvName(e.server))}</span><span class="lk">${e.run ? `<a href="#run/${e.run}">ログを見る</a>` : ""}</span></div>`; }).join("")}`).join("") : `<p class="note" style="padding:14px 18px;margin:0">条件に合う出来事はありません。</p>`}</div>`;
  document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { actState.kind = b.dataset.kind; renderActivity(); });
  document.querySelectorAll("[data-server]").forEach(b => b.onclick = () => { actState.server = b.dataset.server; renderActivity(); });
  const q = $("act-q"); q.oninput = () => { actState.q = q.value; const pos = q.selectionStart; renderActivity(); const n = $("act-q"); n.focus(); n.setSelectionRange(pos, pos); };
}

// ===== run の詳細とログ =====
const logState = { cat: "all", q: "" };
function renderRun(slug) {
  const r = RUNS.find(x => x.slug === slug);
  if (!r) { $("main").innerHTML = `<a class="back" href="#projects">プロジェクト一覧に戻る</a><p>この run は見つかりませんでした。</p>`; return; }
  const s = SRV[r.server], g = GOAL[r.goalId], st = runState(r), pos = stepPos(r);
  const raw = rawLogs(r);
  const entries = [...parseJsonl(raw.session, "session"), ...parseJsonl(raw.provider, "provider"), ...parseJsonl(raw.usage, "usage")]
    .filter(e => e.rec).map(e => ({ ...e, ...describe(e) })).sort((a, b) => T(a.ts) - T(b.ts));
  const sessionRecs = entries.filter(e => e.source === "session");
  const stepLogs = sessionRecs.filter(e => e.disc === "step_complete");
  const lastStart = [...sessionRecs].reverse().find(e => e.disc === "step_start");
  const curStartedAt = r.currentStepStartedAt || lastStart?.ts;
  const execCount = sessionRecs.filter(e => e.disc === "step_start" && e.step === curStep(r)).length;
  const lastPhase = [...sessionRecs].reverse().find(e => e.disc === "phase_start");
  const cats = [["all", "すべて"], ["step", "ステップ・フェーズ"], ["speech", "発言・思考"], ["tool", "ツール"], ["usage", "トークン"], ["error", "エラー"]];
  const cc = countBy(entries, e => e.cat);
  const shown = entries.filter(e => (logState.cat === "all" || e.cat === logState.cat) && (!logState.q || (e.raw + e.body).toLowerCase().includes(logState.q.toLowerCase())));
  let html = "", curKey = null;
  shown.forEach(e => {
    const key = e.step ? `${e.step}#${e.iteration ?? ""}` : "__wf";
    const stepKey = e.step || "__wf";
    if (stepKey !== curKey) {
      curKey = stepKey;
      html += `<div class="log-step">${e.step ? `ステップ ${esc(e.step)}` : "ワークフロー全体"}<span>${e.step ? `${hms(e.ts)} から` : ""}</span></div>`;
    }
    html += `<div class="rec ${e.err ? "err" : ""}"><time>${hms(e.ts)}</time>
      <div class="rk">${esc(e.label)}<small>${esc(e.disc)}</small></div>
      <div class="rb"><p>${esc(e.body)}</p>
        ${e.details.map(([t, v, o]) => `<details${o ? " open" : ""}><summary>${esc(t)}</summary><pre>${esc(v)}</pre></details>`).join("")}
        <details><summary>元の JSON を見る</summary><pre>${esc(JSON.stringify(e.rec, null, 2))}</pre></details>
        <div class="from">${SOURCE_JA[e.source]} の ${e.line} 行目</div></div></div>`;
  });
  const f = (label, v, src, cls = "") => `<div class="f ${cls}"><div class="k">${label}</div><div class="v">${v}</div><div class="src">${src}</div></div>`;
  const logDir = `.takt/runs/${r.slug}/logs/`;
  $("main").innerHTML = `
    <a class="back" href="#projects">プロジェクト一覧に戻る</a>
    <div class="page-head"><div><h1>${esc(r.task)}</h1><p>${esc(r.project)} の run です。${esc(s.name)}（${esc(s.kind)}）で動いています。</p></div>
      <span class="big-badge ${st.cls}"><span class="dot ${st.cls}" aria-hidden="true"></span>${esc(st.label)}</span></div>
    ${s.connected ? "" : `<div class="stale-note" style="margin-bottom:14px">${esc(s.name)} から応答がないため、この画面は ${hms(s.lastReadAt)}（${ago(s.lastReadAt)}）に読めた時点の内容です。</div>`}
    <section class="summary" aria-label="run の要約" style="margin-top:0">
      <div class="sum-grid">
        ${f("サーバー", esc(s.name), "taktDash が読み先として持つ情報")}
        ${f("タスクの状態", `実行中<span class="en">running</span>`, "takt_list_tasks の status")}
        ${f("run の状態", `実行中<span class="en">running</span>`, "takt_get_run の status")}
        ${f("開始と経過", `${hm(r.startedAt)} に始まり、${dur((NOW - T(r.startedAt)) / 1000)} 経っています。`, "takt_list_tasks の startedAt から画面が計算")}
        ${f("ゴール", esc(g.name), "takt_list_tasks の goalId と takt_list_goals", "wide")}
        ${f("要約", esc(r.summary), "takt_list_tasks の summary", "wide")}
        ${f("ワークフロー", "simple-mini", "takt_get_run の workflow")}
        ${f("今のステップ", `<b>${esc(curStep(r))}</b>（${pos.n} ステップ中 ${pos.i} つ目）`, "takt_get_run の currentStep と、ワークフロー定義の steps")}
        ${f("反復とフェーズ", `反復 ${r.steps.length} 回目、フェーズ ${lastPhase ? `${lastPhase.rec.phase}（${PHASE_JA[lastPhase.rec.phaseName]}）` : "なし"}`, "takt_get_run の currentIteration と phase")}
        ${f("このステップ", `${curStartedAt ? hm(curStartedAt) : "—"} に始まり、このステップは ${execCount} 回目の実行です。`, "takt_get_run の currentStepStartedAt と currentStepExecutionCount")}
        ${f("モデル", `${esc(MODEL_LABEL[curModel(r)])}<span class="en">${esc(PROVIDER_OF[curModel(r)])} / ${esc(curModel(r))}</span>`, "ログの step_start の provider と model")}
        ${f("最後のログ", `${hms(r.lastLogAt)}（${ago(r.lastLogAt)}）`, "ログの最後のレコードの timestamp")}
        ${f("runSlug", `<span class="mono">${esc(r.slug)}</span>`, "takt_list_tasks の runSlug", "wide")}
        ${f("完了したステップ", stepLogs.length ? `<div class="steps-line">${stepLogs.map(e => `<span class="stepchip done">${esc(e.step)}（${esc(e.rec.status)}）</span>`).join("")}<span class="stepchip cur">${esc(curStep(r))}（実行中）</span></div>` : `<div class="steps-line"><span class="stepchip cur">${esc(curStep(r))}（実行中）</span></div>`, "takt_get_run の stepLogs")}
        ${f("レポート", r.reports.length ? r.reports.map(([n, b]) => `${esc(n)}（${b.toLocaleString()} バイト）`).join("、") : "まだありません。", "takt_get_run の reports")}
      </div></section>
    <section aria-labelledby="h-log"><h2 class="sec" id="h-log">ログ<span class="sub">${entries.length}件のレコードを時刻順に並べています。</span></h2>
      <div class="filters" style="margin-bottom:12px">
        <div class="note">次の JSONL を読み、1レコードを1ブロックにしています（worktree で動く run では worktree 側の .takt/runs に置かれます）。takt-mcp の takt_get_run で読めるのは完了したステップの本文までなので、ファイルの読み取りは taktDash の側で行う想定です。</div>
        <details><summary>読んでいる JSONL ファイルを見る</summary><ul class="files"><li>${esc(logDir)}${esc(r.session)}.jsonl（本体）</li><li>${esc(logDir)}${esc(r.session)}-provider-events.jsonl（logging.provider_events が true のとき）</li><li>${esc(logDir)}${esc(r.session)}-usage-events.jsonl（logging.usage_events が true のとき）</li></ul></details>
        <div class="chips"><span class="lbl">種類</span>${cats.map(([k, ja]) => `<button type="button" class="chip ${k === "error" ? "warnc" : ""}" data-cat="${k}" aria-pressed="${logState.cat === k}">${ja}<b>${k === "all" ? entries.length : (cc[k] || 0)}</b></button>`).join("")}</div>
        <input class="search" id="log-q" type="search" placeholder="ログの文字で探します" value="${esc(logState.q)}" aria-label="ログを文字で探す">
      </div>
      <p class="count-line">${shown.length}件を表示しています。${cc.error ? `エラーのレコードが ${cc.error}件あり、橙で示しています。` : "エラーのレコードはありません。"}</p>
      <div class="log">${html || `<p class="note" style="padding:14px 18px;margin:0">条件に合うレコードはありません。</p>`}</div>
    </section>
    <a class="back" href="#projects" style="margin-top:16px">プロジェクト一覧に戻る</a>`;
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { logState.cat = b.dataset.cat; renderRun(slug); });
  const q = $("log-q"); q.oninput = () => { logState.q = q.value; const pos = q.selectionStart; renderRun(slug); const n = $("log-q"); n.focus(); n.setSelectionRange(pos, pos); };
}

// ===== ルーター（ハッシュ） =====
function route() {
  const h = location.hash.replace(/^#/, "");
  const [page, arg] = h.split("/");
  const rt = { page: page || "overview", server: page === "overview" ? arg : undefined };
  if (rt.page === "run") { renderSide({ page: "run" }); renderRun(arg); }
  else if (rt.page === "pending") { renderSide(rt); renderPending(); }
  else if (rt.page === "projects") { renderSide(rt); renderProjects(); }
  else if (rt.page === "activity") { renderSide(rt); renderActivity(); }
  else { rt.page = "overview"; renderSide(rt); renderOverview(rt); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
