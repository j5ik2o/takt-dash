[package]
name = "takt-dash-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "takt-dash-cli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt", "net", "time", "sync"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["server"] }

[build-dependencies]
tonic-prost-build = "0.14"
