syntax = "proto3";

package takt_dash.v1;

import "google/protobuf/timestamp.proto";

// taktDash の読み取り系と書き込み系の API を提供する。
// 読み取りは状態を返し、書き込みは takt-mcp の道具を通して takt の状態を変える。
service TaktDashService {
  // すべての集約対象の今の状態を返す。
  rpc GetOverview(GetOverviewRequest) returns (DashboardState);

  // プロジェクトごとの状態と、直近の出来事を返す。
  rpc GetProjects(GetProjectsRequest) returns (GetProjectsResponse);

  // 未回答の問い合わせと人のマージ待ちのゴールとゴール登録の承認待ちからなる判断待ちを返す。
  rpc GetPendingDecisions(GetPendingDecisionsRequest) returns (GetPendingDecisionsResponse);

  // 出来事の一覧と直近7日分の日次集計を返す。
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);

  // 1つの run について、状態ストアと run の保存場所から組み立てた詳細を返す。
  // レポートと指示書は一覧だけを返し、本文は GetRunContent で取得する。
  rpc GetRunDetail(GetRunDetailRequest) returns (GetRunDetailResponse);

  // run のレポートまたは指示書の本文を1件だけ返す。run のディレクトリの外は読まない。
  rpc GetRunContent(GetRunContentRequest) returns (GetRunContentResponse);

  // run 詳細の追記分（本体ログの行とセッションログの活動の印）を、前回の続きから返す。
  // 続きを示せないときは reset を立て、全体を置き換える行を返す。
  rpc GetRunUpdates(GetRunUpdatesRequest) returns (GetRunUpdatesResponse);

  // manager の会話を時系列で返す。after_seq で増分取得できる。
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // すべてのサーバー・すべてのプロジェクトのゴールを返す。
  rpc GetGoals(GetGoalsRequest) returns (GetGoalsResponse);

  // 1つのゴールの詳細を返す。
  rpc GetGoalDetail(GetGoalDetailRequest) returns (GetGoalDetailResponse);

  // 1つのタスクの詳細を返す。
  rpc GetTaskDetail(GetTaskDetailRequest) returns (GetTaskDetailResponse);

  // 接続時に即時に全件を返し、その後は状態が変わるたびに送る。
  rpc WatchState(WatchStateRequest) returns (stream DashboardState);

  // 判断待ちの問い合わせへ回答する。回答の内容は問い合わせの種類に応じて text か report を使う。
  rpc AnswerInquiry(AnswerInquiryRequest) returns (AnswerInquiryResponse);

  // プルリクエストのマージを承認し、マージのタスクを依頼する。
  rpc ApproveGoalMerge(ApproveGoalMergeRequest) returns (ApproveGoalMergeResponse);

  // ゴール登録の承認待ちを承認する。
  rpc ApproveGoalRegistration(ApproveGoalRegistrationRequest) returns (ApproveGoalRegistrationResponse);

  // ゴール登録の承認待ちを却下する。
  rpc RejectGoalRegistration(RejectGoalRegistrationRequest) returns (RejectGoalRegistrationResponse);

  // ゴール登録の承認待ちを、判断待ちの一覧へ表示できる形で返す。
  rpc ListGoalRegistrationProposals(ListGoalRegistrationProposalsRequest) returns (ListGoalRegistrationProposalsResponse);
}

// ゴールの状態を表す。
enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  GOAL_STATUS_CREATED = 1;
  GOAL_STATUS_AWAITING_MERGE = 2;
  GOAL_STATUS_COMPLETED = 3;
}

// ゴールの実行状態を表す。
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_ACTIVE = 1;
  EXECUTION_STATUS_PAUSED = 2;
  EXECUTION_STATUS_ABORTED = 3;
}

// run の状態を表す。
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_ABORTED = 3;
  RUN_STATUS_FAILED = 4;
}

// タスクの状態を表す。
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_EXCEEDED = 5;
  TASK_STATUS_PR_FAILED = 6;
}

// アクティビティの出来事の種類を表す。
enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  ACTIVITY_KIND_GOAL_CREATED = 1;
  ACTIVITY_KIND_RUN_STARTED = 2;
  ACTIVITY_KIND_TASK_COMPLETED = 3;
  ACTIVITY_KIND_INQUIRY = 4;
  ACTIVITY_KIND_AWAITING_MERGE = 5;
  ACTIVITY_KIND_PAUSED = 6;
  ACTIVITY_KIND_BLOCKED = 7;
  ACTIVITY_KIND_CONNECTION_LOST = 8;
  ACTIVITY_KIND_CONNECTION_RESTORED = 9;
  ACTIVITY_KIND_TASK_FAILED = 10;      // タスクが失敗した
  ACTIVITY_KIND_TASK_EXCEEDED = 11;    // タスクが上限を超えて止まった
  ACTIVITY_KIND_TASK_PR_FAILED = 12;   // タスクのプルリクエストの作成に失敗した
  ACTIVITY_KIND_RUN_FAILED = 13;       // run が失敗で終わった
  ACTIVITY_KIND_RUN_ABORTED = 14;      // run が中断された
  ACTIVITY_KIND_BACKEND_STARTED = 15;  // taktDash の backend が起動した
}

// プロジェクトの接続状態を表す。
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;  // まだ一度も読めていない
  CONNECTION_STATE_CONNECTED = 1;    // 接続中
  CONNECTION_STATE_DELAYED = 2;      // 接続中だが直近の読み取りが失敗している（遅延中）
  CONNECTION_STATE_UNRESPONSIVE = 3; // しきい値を超えて応答がない
}

// 判断待ちの問い合わせの種類を表す。
enum InquiryKind {
  INQUIRY_KIND_UNSPECIFIED = 0;
  INQUIRY_KIND_QUESTION = 1;
  INQUIRY_KIND_OPERATION_REQUEST = 2;
}

// 判断待ちの種類を表す。
// 判断待ちの一覧は未回答の問い合わせと人のマージ待ちのゴールとゴール登録の承認待ちからなる。
enum PendingDecisionType {
  PENDING_DECISION_TYPE_UNSPECIFIED = 0;
  PENDING_DECISION_TYPE_INQUIRY = 1;
  PENDING_DECISION_TYPE_AWAITING_MERGE = 2;
  PENDING_DECISION_TYPE_GOAL_REGISTRATION = 3;
}

// 会話の発話者を表す。
enum ConversationSpeaker {
  CONVERSATION_SPEAKER_UNSPECIFIED = 0;
  CONVERSATION_SPEAKER_USER = 1;
  CONVERSATION_SPEAKER_MANAGER = 2;
  CONVERSATION_SPEAKER_SYSTEM = 3;
  CONVERSATION_SPEAKER_DIRECTOR = 4;
}

// 集約対象のサーバーを表す。
message Server {
  string server_id = 1;                        // 識別子
  string name = 2;                             // 名前
  string kind = 3;                             // 表示用の機種ラベル（"Mac mini" など）
  bool connected = 4;                          // 応答の有無
  google.protobuf.Timestamp last_read_at = 5;  // 最後に読めた時刻
  bool write_only = 7;                         // 書き込み専用（読み取りプロジェクトを持たず、書き込み先としてだけ使われる）

  // 同時実行の上限はサーバー単位には存在せず、プロジェクト単位であるため、
  // かつて使っていた 6 番（concurrency）は欠番にする。
  reserved 6;
  reserved "concurrency";
}

// 集約対象のプロジェクトを表す。
message Project {
  string name = 1;                             // 名前
  string about = 2;                            // 説明
  string server_id = 3;                        // 集約設定上のサーバー
  int32 completed_tasks_24h = 4;               // 直近24時間に完了したタスクの件数
  bool connected = 5;                          // 応答の有無（プロジェクト単位）
  google.protobuf.Timestamp last_read_at = 6;  // 最後に読めた時刻
  ConnectionState connection_state = 7;        // 接続状態（未読は UNSPECIFIED）
  int32 concurrency = 8;                       // 同時実行の上限（.takt/config.yaml の concurrency。キーが無ければ takt の既定値1）
}

// タスクの状態ごとの件数を表す。
message TaskStatusCounts {
  int32 pending = 1;
  int32 running = 2;
  int32 completed = 3;
  int32 failed = 4;
  int32 exceeded = 5;
  int32 pr_failed = 6;
}

// プルリクエストを表す。
message PullRequest {
  int64 number = 1;  // 番号
  string url = 2;    // URL
}

// ゴールを表す。
message Goal {
  string goal_id = 1;                                  // ID
  string server_id = 2;                                // サーバー
  string project = 3;                                  // プロジェクト
  string name = 4;                                     // 名前
  GoalStatus status = 5;                               // 状態
  ExecutionStatus execution_status = 6;                // 実行状態
  TaskStatusCounts task_counts = 7;                    // タスクの状態ごとの件数
  optional string paused_reason = 8;                   // 一時停止の理由
  PullRequest pull_request = 9;                        // プルリクエストの番号と URL
  optional google.protobuf.Timestamp awaiting_merge_at = 10;  // awaiting_merge のゴールでは人のマージ待ちになった時刻（仕上げタスクが未着手・実行中のあいだは無い）。それ以外のゴールでは awaiting_merge 通知の時刻
  optional TaskStatus merge_task_last = 11;            // 仕上げタスクの最後の状態（なければ人のマージ待ち）
  bool name_truncated = 12;                            // name は takt が切った preview で、続きがある（takt の応答の印による。name 自体には省略記号を含めない）
}

// ゴールの実行で通ったステップを表す。
message RunStep {
  string step_name = 1;                           // ステップ名
  string model = 2;                               // モデル
  google.protobuf.Timestamp started_at = 3;       // 開始時刻
  optional google.protobuf.Timestamp ended_at = 4;  // 終了時刻（継続中は省略する）
}

// run のレポートの要約を表す。
message ReportSummary {
  string filename = 1;  // ファイル名
  int64 size_bytes = 2;  // 大きさ（バイト）
}

// 走っている run を表す。
message Run {
  string run_slug = 1;                              // runSlug
  string session_id = 2;                            // セッション
  string server_id = 3;                             // サーバー
  string project = 4;                               // プロジェクト
  string goal_id = 5;                               // ゴール ID
  string task_name = 6;                             // タスク名
  string summary = 7;                               // 要約
  optional google.protobuf.Timestamp started_at = 8;  // 開始時刻（実行中の run は未設定があり得る）
  repeated RunStep steps = 9;                       // ステップの履歴（入れ子 workflow の内側の step を含み、末尾が今のステップとは限らない）
  optional google.protobuf.Timestamp current_step_started_at = 10;  // 今のステップの開始時刻
  optional google.protobuf.Timestamp last_log_at = 11;  // 最後のログの時刻（実行中の run は未設定があり得る）
  repeated ReportSummary reports = 12;              // レポートの一覧
  RunStatus status = 13;                            // 状態
  bool log_silent = 14;                             // ログの無音の判定済みフラグ
  optional int32 current_step_number = 15;          // 現在のステップの位置（1 始まり。不明なら省略）
  optional int32 total_steps = 16;                   // workflow の全ステップ数（不明なら省略）
  optional int32 current_iteration = 17;             // 現在の反復回数（不明なら省略）
  optional string current_step_name = 18;            // 今のステップ名（current_step_number と同じ step 集合。不明なら省略）
}

// 判断待ちの項目を表す。
message PendingDecision {
  PendingDecisionType type = 1;           // 種類（問い合わせ・マージ待ち・ゴール登録の承認待ち）
  string server_id = 2;                   // サーバー
  string project = 3;                     // プロジェクト
  optional string goal_id = 4;            // ゴール ID（ゴールに属さない問い合わせは省略する）
  InquiryKind inquiry_kind = 5;           // 問い合わせの種類（質問・作業の依頼）
  google.protobuf.Timestamp created_at = 6;  // 作成時刻
  string body = 7;                        // 本文
  repeated string options = 8;            // 選択肢
  PullRequest pull_request = 9;           // マージ待ちのプルリクエスト
  bool stale = 10;                        // 滞留の判定済みフラグ
  string inquiry_id = 11;                 // 問い合わせの識別子（AnswerInquiry の inquiry_id に渡す。マージ待ちは空。ゴールに属さない問い合わせには回答できない）
  optional int32 revision = 12;           // ゴール登録の承認待ちの revision（承認・却下に渡す。それ以外は省略）
  optional TaskStatus merge_task_last = 13;  // マージ待ちのゴールの仕上げタスクの最後の状態（それ以外は省略する）
  bool body_truncated = 14;               // body は takt が切った文で、続きがある（takt の応答の印による。body 自体には省略記号を含めない）
}

// 異常判定の基準を表す。
message AnomalyThresholds {
  int32 pending_decision_stale_minutes = 1;  // 判断待ちの滞留の基準（分）
  int32 run_log_silent_minutes = 2;          // ログの無音の基準（分）
}

// ビルド元の情報を表す。
message BuildInfo {
  string commit = 1;  // ビルド元の短縮コミット SHA（取得できない場合は "unknown"）
  string branch = 2;  // ビルド元のブランチ名（取得できない場合は "unknown"）
}

// 集約した状態のまとまりを表す。
message DashboardState {
  google.protobuf.Timestamp read_at = 1;    // この状態を読んだ時刻
  repeated Server servers = 2;              // サーバー
  repeated Project projects = 3;            // プロジェクト
  repeated Goal goals = 4;                  // ゴール
  repeated Run runs = 5;                    // run
  repeated PendingDecision pending_decisions = 6;  // 判断待ち
  AnomalyThresholds thresholds = 7;         // 異常判定の基準
  BuildInfo build_info = 8;                 // backend 自身のビルド元
}

// 概要の取得を要求する。
message GetOverviewRequest {}

// プロジェクトの取得を要求する。
message GetProjectsRequest {}

// プロジェクトの取得への応答を表す。
message GetProjectsResponse {
  DashboardState state = 1;                  // 状態
  repeated ActivityEvent recent_events = 2;  // 直近の出来事
}

// 判断待ちの取得を要求する。
message GetPendingDecisionsRequest {}

// 判断待ちの取得への応答を表す。
message GetPendingDecisionsResponse {
  DashboardState state = 1;  // 状態
}

// アクティビティの取得を要求する。
message GetActivityRequest {}

// アクティビティの出来事を表す。
message ActivityEvent {
  google.protobuf.Timestamp occurred_at = 1;  // 時刻
  string server_id = 2;                       // サーバー（backend の起動は、どのサーバーにも属さないため空にする）
  optional string project = 3;                // プロジェクト（接続断などサーバー全体の出来事は省略する）
  ActivityKind kind = 4;                      // 種類
  string body = 5;                            // 本文
  optional string run_slug = 6;               // 対象の run
}

// 日次集計を表す。
message DailySummary {
  string date = 1;       // 日付（JST の日を "YYYY-MM-DD" で表す）
  int32 total = 2;       // 総数
  int32 attention = 3;   // 判断待ちと異常の件数
}

// サーバーごとの出来事の件数を表す。
message ServerEventCount {
  string server_id = 1;  // サーバー
  int32 count = 2;       // 件数
}

// アクティビティの取得への応答を表す。
message GetActivityResponse {
  DashboardState state = 1;                      // 状態
  repeated ActivityEvent events = 2;             // 出来事の一覧（新しい順）
  repeated DailySummary daily_summaries = 3;     // 7日分の日次集計
  repeated ServerEventCount today_counts_by_server = 4;  // サーバーごとの当日の出来事の件数
}

// run 詳細の取得を要求する。
message GetRunDetailRequest {
  string run_slug = 1;  // runSlug
}

// run のステップの記録を表す。
message StepLog {
  string step_name = 1;                       // ステップ名
  string persona = 2;                         // ペルソナ
  string status = 3;                          // 状態
  string content = 4;                         // 本文
  google.protobuf.Timestamp timestamp = 5;    // 時刻
  int32 iteration = 6;                        // 反復回数
}

// run のレポートの一覧項目を表す。本文は GetRunContent で取得する。
message RunReport {
  reserved 2;
  reserved "content";
  string filename = 1;  // reports/ からの相対パス
  int64 size_bytes = 3;  // 大きさ（バイト）
}

// run への指示書の一覧項目を表す。本文は GetRunContent で取得する。
message RunInstruction {
  reserved 4;
  reserved "content";
  int32 instruction_id = 1;                    // 指示書の ID
  google.protobuf.Timestamp issued_at = 2;     // 発行時刻
  string state = 3;                            // 状態（pending / deliveredSameSession / deliveredNextStep / unconsumedWarned）
}

// run 詳細の取得への応答を表す。
// 状態ストアと run の保存場所（meta.json、本体ログの末尾、reports/、interventions.jsonl）から組み立てる。
message GetRunDetailResponse {
  string run_slug = 1;                          // runSlug
  string session_id = 2;                        // セッション
  string server_id = 3;                         // サーバー
  string project = 4;                           // プロジェクト
  string goal_id = 5;                           // ゴール ID
  string task_name = 6;                         // タスク名
  string task_text = 7;                         // タスクの本文
  string summary = 8;                           // 要約
  string workflow = 9;                          // ワークフロー
  RunStatus status = 10;                        // 状態
  optional google.protobuf.Timestamp started_at = 11;  // 開始時刻（実行中の run は未設定があり得る）
  optional string current_step = 12;            // 今のステップ
  optional int32 current_iteration = 13;        // 今の反復回数
  optional google.protobuf.Timestamp current_step_started_at = 14;  // 今のステップの開始時刻
  optional int32 current_step_execution_count = 15;  // 今のステップの実行回数
  optional int32 phase = 16;                    // フェーズ
  repeated StepLog step_logs = 17;              // ステップの一覧とその本文
  string log_tail = 18;                         // ログの末尾
  repeated RunReport reports = 19;              // レポートの一覧
  repeated RunInstruction instructions = 20;    // 指示書の一覧
  optional google.protobuf.Timestamp last_log_at = 21;  // 最後のログの時刻（実行中の run は未設定があり得る）
  bool log_silent = 22;                         // ログの無音の判定済みフラグ
  bool server_connected = 23;                   // 読み先の応答の有無
  google.protobuf.Timestamp server_last_read_at = 24;  // 読み先から最後に読めた時刻
  bool logs_removed = 25;                       // run の保存場所が残っていない（掃除済みの worktree など）
}

// run のレポートまたは指示書の本文の取得を要求する。
message GetRunContentRequest {
  string run_slug = 1;  // runSlug
  oneof target {
    string report_filename = 2;  // reports/ からの相対パス（.md）
    int32 instruction_id = 3;    // 指示書の ID（1 以上）
  }
}

// run のレポートまたは指示書の本文の取得への応答を表す。
message GetRunContentResponse {
  string run_slug = 1;   // runSlug
  string content = 2;    // 本文（上限を超えた分は切り詰める）
  int64 size_bytes = 3;  // 本文全体の大きさ（バイト）
  bool truncated = 4;    // 上限で切り詰めたか
}

// run 詳細の追記分の取得を要求する。続きの位置（epoch と after_sequence）は両方を送るか、両方を省く。
message GetRunUpdatesRequest {
  string run_slug = 1;                // runSlug
  optional int64 epoch = 2;           // 前回の応答の世代
  optional int64 after_sequence = 3;  // 前回までに受け取った最後の行の番号
}

// run 詳細のログの1行を表す。
message RunLogLine {
  int64 sequence = 1;  // 行の番号（同じ世代の中で増えていく）
  string text = 2;     // 「時刻 種類 ステップ」の行
}

// セッションログ（logs/phase1-execution/）からの活動の印を表す。
message RunSessionActivity {
  optional string latest_tool = 1;                    // 直近の道具名
  int64 tool_use_count = 2;                           // 道具の呼び出しの件数
  optional google.protobuf.Timestamp updated_at = 3;  // セッションログのファイルの最新の更新時刻
}

// run 詳細の追記分の取得への応答を表す。
message GetRunUpdatesResponse {
  string run_slug = 1;                  // runSlug
  int64 epoch = 2;                      // 行の番号の世代
  bool reset = 3;                       // 行を置き換えるか（偽なら前回の続きとして足す）
  repeated RunLogLine lines = 4;        // 返す行（古い順）
  RunSessionActivity activity = 5;      // セッションログからの活動の印
  bool logs_removed = 6;                // run の保存場所が残っていない
}

// ゴール一覧の要求。
message GetGoalsRequest {}

// ゴール一覧の応答。
message GetGoalsResponse {
  repeated Goal goals = 1;  // 全サーバー・全プロジェクトのゴール
}

// ゴール詳細の要求。
message GetGoalDetailRequest {
  string goal_id = 1;  // ゴール ID
}

// ゴールの作業記録。
message GoalWorkLog {
  string work_log_id = 1;                     // 記録の ID
  google.protobuf.Timestamp recorded_at = 2;  // 記録した時刻
  string summary = 3;                         // 記録の本文
}

// ゴールに対する manager の質問と回答。
message GoalQuestion {
  string question_id = 1;                            // 質問の ID
  string kind = 2;                                   // 種類（question / operation_request / approval）
  string status = 3;                                 // 状態（pending / answered / withdrawn）
  string body = 4;                                   // 質問の本文
  repeated string options = 5;                       // 選択肢
  optional string answer_text = 6;                   // 回答の本文
  optional string answer_decision = 7;               // 回答の判断（allow / deny）
  optional string answer_report = 8;                 // 作業の報告（completed / unable）
  optional google.protobuf.Timestamp created_at = 9;   // 質問した時刻
  optional google.protobuf.Timestamp answered_at = 10; // 回答した時刻
}

// ゴールに紐づくタスク。
message GoalTask {
  string task_name = 1;          // タスク名
  TaskStatus status = 2;         // 状態
  optional string run_slug = 3;  // runSlug
}

// ゴール詳細の応答。
message GetGoalDetailResponse {
  string goal_id = 1;                        // ゴール ID
  string server_id = 2;                      // サーバー
  string project = 3;                        // プロジェクト
  GoalStatus status = 4;                     // 状態
  ExecutionStatus execution_status = 5;      // 実行状態
  string objective = 6;                      // 目的
  repeated string out_of_scope = 7;          // 対象外
  repeated string acceptance_criteria = 8;   // 受け入れ条件
  repeated string constraints = 9;           // 制約
  map<string, string> specifications = 10;   // 仕様（gherkin / quint / alloy）
  string branch = 11;                        // ゴールブランチ
  string integration_branch = 12;            // 統合ブランチ
  repeated GoalWorkLog work_log = 13;        // 作業記録
  repeated GoalQuestion questions = 14;      // 質問と回答
  repeated GoalTask tasks = 15;              // 紐づくタスク
}

// タスク詳細の要求。
message GetTaskDetailRequest {
  string project = 1;           // プロジェクト名
  string task_name = 2;         // タスク名
  optional string goal_id = 3;  // ゴール ID（指定時は一致するタスクに限る）
}

// タスク詳細の応答。
message GetTaskDetailResponse {
  string project = 1;                                  // プロジェクト
  string task_name = 2;                                // タスク名
  optional string goal_id = 3;                         // ゴール ID
  TaskStatus status = 4;                               // 状態
  string summary = 5;                                  // 要約
  optional google.protobuf.Timestamp started_at = 6;   // 開始時刻
  optional string run_slug = 7;                        // runSlug
  optional int64 pull_request_number = 8;              // 仕上げタスクのプルリクエスト番号
  repeated string linked_run_slugs = 9;                // 紐づく run の一覧
  optional string branch = 10;                         // ゴールのブランチ
  optional string pull_request_url = 11;               // ゴールのプルリクエスト URL
  optional google.protobuf.Timestamp created_at = 12;  // 作成時刻
  optional google.protobuf.Timestamp completed_at = 13; // 完了時刻
}

// 会話の取得を要求する。
message GetConversationRequest {
  string project = 1;              // プロジェクト名
  optional string session_id = 2;  // セッション（省略時は最新の manager のセッション）
  int64 after_seq = 3;             // この seq より後の行を返す
  int32 limit = 4;                 // 調べる行数の上限
}

// 会話の1件を表す。
message ConversationMessage {
  int64 seq = 1;                              // セッション内の順序
  google.protobuf.Timestamp occurred_at = 2;  // 発言の時刻
  ConversationSpeaker speaker = 3;            // 発話者
  string text = 4;                            // 本文
  optional string notice = 5;                 // 本文に添える注意書き（元記録の文字化けなど）
  optional ConversationDetail detail = 6;     // 折りたたみの中で見せる元の入力（出来事や質問への回答から始まったターン）
}

// 会話の1件の、折りたたみの中で見せる元の入力を表す。
message ConversationDetail {
  optional string question = 1;  // 質問への回答のときの、質問の文
  string source_json = 2;        // 元の JSON（整形済み）
}

// 解釈できずスキップした行の理由と件数を表す。
message ConversationSkipped {
  string reason = 1;  // スキップした理由
  int32 count = 2;    // 件数
}

// 会話の取得への応答を表す。
message GetConversationResponse {
  string project = 1;                          // プロジェクト名
  string session_id = 2;                       // セッション
  string provider = 3;                         // プロバイダ（この版は opencode のみ）
  repeated ConversationMessage messages = 4;    // 会話の並び（seq の昇順）
  int64 next_after_seq = 5;                    // 次回に指定する after_seq
  bool has_more = 6;                           // 未読の行が残っているか
  repeated ConversationSkipped skipped = 7;     // スキップした行の理由と件数
  optional string unavailable_reason = 8;      // 保存先が無いなどの理由
}

// 状態ストリーミングの接続を要求する。
message WatchStateRequest {}

// operation_request への回答の種類を表す。
enum OperationAnswerReport {
  OPERATION_ANSWER_REPORT_UNSPECIFIED = 0;
  OPERATION_ANSWER_REPORT_COMPLETED = 1;  // 実施した
  OPERATION_ANSWER_REPORT_UNABLE = 2;     // 対応できない
}

// 書き込み要求の idempotency_key は、利用者の1回の操作を表す任意の鍵（1〜128文字の ASCII 表示文字）。
// 同じ鍵と同じ内容の要求は、応答が期限切れになったあとの再試行や同時の重複であっても、
// takt への書き込みを1回だけ行い、同じ結果を返す。鍵を省いた要求は重複を検出しない。
// backend は鍵の記録をメモリに持ち、書き込みの決着から1時間だけ保つ。backend の再起動か1時間の経過の
// あとは、同じ鍵の要求を新しい操作として扱う。結果が不明のまま決着した鍵の要求は、takt へ送り直さず
// DEADLINE_EXCEEDED を返す。状態を確かめたあとのやり直しには新しい鍵を使う。

// 問い合わせへの回答を要求する。
//
// 回答は、判断待ちの一覧（GetPendingDecisions、WatchState）にある問い合わせにだけ送る。一覧に無い
// inquiry_id は NOT_FOUND で断る。goal_id を指定したときは、一覧の判断待ちが持つゴールと照合し、
// 食い違えば takt へ送らずに FAILED_PRECONDITION で断る。断られたら、一覧を取得し直してから
// やり直す。
message AnswerInquiryRequest {
  string server_id = 1;                              // サーバー
  string project = 2;                                // プロジェクト
  optional string goal_id = 3;                       // ゴール ID（省略すると判断待ちの一覧から引き当てる。指定するなら一覧のゴールと同じ値。ゴールに属さない問い合わせには回答できない）
  string inquiry_id = 4;                             // 問い合わせの識別子（判断待ちの inquiry_id）
  optional string text = 5;                          // 自由記述または選択肢の回答（質問への回答で使う）
  optional OperationAnswerReport report = 6;         // 作業の依頼への回答（operation_request で使う）
  optional string idempotency_key = 7;               // 重複を防ぐ鍵（省略可）
}

// 問い合わせへの回答への応答を表す。
message AnswerInquiryResponse {
  string inquiry_id = 1;                             // 受け付けた回答の対象の識別子
}

// プルリクエストのマージの承認を要求する。
message ApproveGoalMergeRequest {
  string server_id = 1;  // サーバー
  string project = 2;    // プロジェクト
  string goal_id = 3;    // ゴール ID
  int64 pr_number = 4;   // プルリクエストの番号
  string until = 5;      // "prepare" なら準備まで、"merge" ならマージまで行う
  optional string idempotency_key = 6;  // 重複を防ぐ鍵（省略可）
}

// プルリクエストのマージの承認への応答を表す。
message ApproveGoalMergeResponse {
  string task_name = 1;  // 依頼したタスク名
  string workflow = 2;   // 使うワークフロー
}

// ゴール登録の承認を要求する。
//
// revision は、判断待ちの一覧（GetPendingDecisions、WatchState、ListGoalRegistrationProposals）に
// ある承認待ちと照合する。一覧に無い revision と、接続先の設定が変わる前に読んだ一覧の revision は、
// takt へ送らずに FAILED_PRECONDITION で断る。断られたら、一覧を取得し直してからやり直す。
message ApproveGoalRegistrationRequest {
  string server_id = 1;  // サーバー
  string project = 2;    // プロジェクト
  int32 revision = 3;    // 承認待ちの revision
  optional string idempotency_key = 4;  // 重複を防ぐ鍵（省略可）
}

// ゴール登録の承認への応答を表す。
message ApproveGoalRegistrationResponse {
  int32 revision = 1;    // 承認した revision
  string goal_id = 2;    // 登録されたゴールの ID
}

// ゴール登録の却下を要求する。revision の照合は ApproveGoalRegistrationRequest と同じ。
message RejectGoalRegistrationRequest {
  string server_id = 1;  // サーバー
  string project = 2;    // プロジェクト
  int32 revision = 3;    // 却下する承認待ちの revision
  optional string idempotency_key = 4;  // 重複を防ぐ鍵（省略可）
}

// ゴール登録の却下への応答を表す。
message RejectGoalRegistrationResponse {
  int32 revision = 1;    // 却下した revision
}

// ゴール登録の承認待ちを表す。判断待ちの一覧へ表示できる形にする。
message GoalRegistrationProposal {
  int32 revision = 1;    // 承認待ちの revision
  string server_id = 2;  // サーバー
  string project = 3;    // プロジェクト
  string body = 4;       // 本文（提案の要約）
  string repository_directory = 5;  // 提案の対象プロジェクトのディレクトリ
}

// ゴール登録の承認待ちの取得を要求する。
message ListGoalRegistrationProposalsRequest {
  string server_id = 1;  // サーバー
  string project = 2;    // プロジェクト
}

// ゴール登録の承認待ちの取得への応答を表す。
message ListGoalRegistrationProposalsResponse {
  repeated GoalRegistrationProposal proposals = 1;  // 承認待ち（無ければ空）
}
