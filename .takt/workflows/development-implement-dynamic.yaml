# TAKT 0.76.1 の builtin development-implement-dynamic をプロジェクトで上書きする。
# 実装・再実装ステップの promotion を追加する。共通の step fragment は
# promotion 非対応の Team Leader 工程でも使われるため、ここで宣言する。
name: development-implement-dynamic
description: 共通開発 workflow で動的ファセットを使う実装実行。
# 明示した別名は、組み込みの呼び出し元から渡されるファセット引数を受け取るために必要。
policies:
  coding: development-implementation-facets/policies/coding.md
  testing: development-implementation-facets/policies/testing.md
  ai-antipattern: development-implementation-facets/policies/ai-antipattern.md
  takt-testing: development-implementation-facets/policies/takt-testing.md
  architecture: development-implementation-facets/policies/architecture.md
  existing-system-respect: development-implementation-facets/policies/existing-system-respect.md
  implementation-semantics: development-implementation-facets/policies/implementation-semantics.md
  takt: development-implementation-facets/policies/takt.md
knowledge:
  architecture: development-implementation-facets/knowledge/architecture.md
  implementation-semantics: development-implementation-facets/knowledge/implementation-semantics.md
  taktdash-rules: ../facets/knowledge/taktdash-rules.md
  takt: development-implementation-facets/knowledge/takt.md
  takt-test-execution: development-implementation-facets/knowledge/takt-test-execution.md
  existing-system: development-implementation-facets/knowledge/existing-system.md
instructions:
  development-implement-with-reports: development-implementation-facets/instructions/development-implement-with-reports.md
  development-reimplement-with-reports: development-implementation-facets/instructions/development-reimplement-with-reports.md
  development-maintenance-with-reports: development-implementation-facets/instructions/development-maintenance-with-reports.md
report_formats:
  coder-scope: development-implementation-facets/output-contracts/coder-scope.md
  maintenance-scope: development-implementation-facets/output-contracts/maintenance-scope.md
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    reimplementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-reimplement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities:
      - edit
    uses: development-core-implement
    promotion:
      - at: 2
    instruction:
      - $param: implementation_instruction
      - development-implementation-completion
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    dynamic_facets:
      pool:
        $param: implementation_pool
    companion:
      $param: implementation_companions
    rules:
      - condition: 今回必要な実装を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない。レポートの未完了ラベルだけでは差し戻さない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、必須検証も完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 採用済み計画は有効で、実装・原因調査・必須検証に不足があり、今回必要な具体的補完作業を現在の計画内で実行できる（同じ制約で失敗した手段は、結果に影響する条件の差分と制約の解消・回避根拠なしに新作業としない。未実行・失敗・未確認という報告だけでは計画変更としない）
        next: reimplement
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
      - condition: 現行計画で実行できる必須作業も計画変更で可能になる具体的なプロジェクト内作業もなく、環境制約による検証の未確認、不可欠な外部操作・回答、または条件が両立しないと考える根拠がある（利用可能なユーザー入力で進められる場合を除く）。試行証跡・制約・未完了義務を保持し、独立レビューへの引継ぎ、続行、停止の判断を計画側へ渡す
        return: need_replan
      - condition: ユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true
  - name: reimplement
    capabilities:
      - edit
    uses: development-core-implement
    # implement から補完のために差し戻された工程なので、初回から次段を使う。
    promotion:
      - at: 1
    instruction:
      - $param: reimplementation_instruction
      - development-implementation-completion
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    dynamic_facets:
      pool:
        $param: implementation_pool
    companion:
      $param: implementation_companions
    rules:
      - condition: 補完すべき実装・原因調査を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、未実行だった必須検証を完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 採用済み計画は有効だが、補完後も実装・原因調査・必須検証に不足があり、今回必要な未試行の作業をプロジェクト内で実行できる（利用可能なユーザー入力で解消できる場合を除く）。試行済みの方式・条件・結果・証跡・制約と、次の作業の実質的な差分を報告し、計画側へ続行判断を渡す
        return: need_replan
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
      - condition: 現行計画で実行できる必須作業も計画変更で可能になる具体的なプロジェクト内作業もなく、環境制約による検証の未確認、不可欠な外部操作・回答、または条件が両立しないと考える根拠がある（利用可能なユーザー入力で進められる場合を除く）。試行証跡・制約・未完了義務を保持し、独立レビューへの引継ぎ、続行、停止の判断を計画側へ渡す
        return: need_replan
      - condition: ユーザー入力が必要
        next: reimplement
        requires_user_input: true
        interactive_only: true
