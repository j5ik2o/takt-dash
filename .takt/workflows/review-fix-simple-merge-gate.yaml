# 元にした builtin: takt 0.76.1 の builtins/ja/workflows/review-fix-simple.yaml
#
# merge-review-fix-simple-thread-gate（until: merge の統合用）の review ステップだけが呼ぶ。
# builtin の最終関門（final-gate）は、統合した後にしか確かめられない受け入れ条件
# （main へのマージそのもの、マージ後の本番での実測など）を「外部確認待ち」として扱い、
# それだけが残ると BLOCKED を返す。統合用のタスクではその条件を原理的に満たせず、
# 統合が止まる（issue #122、PR #109）。final_gate_instruction を差し替える引数は
# review-fix-simple の外から渡せないため、builtin を写して差し替える。
#
# 最終関門の報告の形式（出力契約）も替える必要があるため、呼び出し先の peer-review も
# peer-review-merge-gate に写して替える（そちらの冒頭コメントを参照）。
#
# builtin との差分は次の (a)-(d) である。
#   (a) name と description
#   (b) この冒頭コメント
#   (c) final_gate_instruction を taktdash-merge-final-gate にする
#   (d) reviewers の呼び出し先を peer-review から peer-review-merge-gate にする
#
# builtin を更新するときは、新しい版の review-fix-simple.yaml との diff を取り、
# (a)-(d) を除いた差分を取り込んでから
# `takt workflow doctor merge-review-fix-simple-thread-gate` を再実行する。
name: review-fix-simple-merge-gate
subworkflow:
  callable: true
  visibility: internal
description: 1体の読み取り専用レビュアーによるレビューの後、指摘を裁定・修正し、再レビューと要件確認を行う。統合の後にしか確かめられない受け入れ条件だけが残るときは止めずに統合へ進める。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

initial_step: gather

steps:
  - name: gather
    uses: review-gather-with-clarification-to-reviewers
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: レビュー対象を特定できない、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}

  - name: reviewers
    description: 1体のレビュアーによるレビューから指摘の裁定・修正・再レビューを進め、要件充足を最終確認する
    kind: workflow_call
    call: peer-review-merge-gate
    args:
      reviewer_suite: single-review-suite
      review_policy_additions: []
      review_knowledge_additions:
        - architecture
        - unit-testing
        - e2e-testing
      security_review_knowledge_additions: []
      security_review_pool: security-review-facets
      fix_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      remediation_workflow: development-remediation-dynamic
      fix_pool: coding-facets
      plan_policy:
        - coding
        - testing
        - review
        - architecture
      fix_policy:
        - coding
        - testing
        - ai-antipattern
      fix_knowledge:
        - architecture
        - implementation-semantics
      verification_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      verification_policy:
        - coding
        - testing
        - review
        - architecture
      final_gate_policy:
        - coding
        - testing
        - review
        - architecture
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: taktdash-merge-final-gate
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: ABORT
      - condition: ABORT
        next: ABORT
