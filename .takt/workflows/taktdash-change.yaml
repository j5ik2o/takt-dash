name: taktdash-change
description: >-
  taktDash の変更作業の標準ワークフロー。builtin の development-core に
  taktdash-rules の知識を注入して計画・実装・レビュー・修正を行う。
  develop の後、整形・clippy・テスト・型検査・lint を make done で
  判定する機械ゲートの固定ステップを回す。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction
    - ref: taktdash-coding-rules
      position: before_instruction
max_steps: 70
initial_step: mark_in_progress
steps:
  - name: mark_in_progress
    description: 開始時に対象 issue を解決し、ボードの Status を In Progress にする（失敗は非致命）
    mode: system
    system_inputs:
      - type: command
        as: status
        command: |
          python3 tools/project-status/publish.py status --status "In Progress"
        timeout_ms: 120000
    rules:
      - condition: when(true)
        next: develop
  - name: develop
    description: development-core で計画・テスト作成・実装・レビュー・修正・要件確認を行う
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      review_policy_additions: []
      review_policy:
        - coding
        - testing
        - review
        - architecture
      plan_knowledge:
        - architecture
        - task-decomposition
        - taktdash-rules
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      development_knowledge:
        - architecture
        - implementation-semantics
        - taktdash-rules
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      security_review_knowledge_additions:
        - taktdash-rules
    rules:
      - condition: COMPLETE
        next: machine_gate
      - condition: ABORT
        next: ABORT
  - name: machine_gate
    description: make done（整形・clippy・テスト・型検査・lint）をdevelop の成果に対して実行し、すべて通るときだけ完了とする
    mode: system
    system_inputs:
      - type: command
        as: result
        command: make done
        timeout_ms: 1800000
    rules:
      - condition: when(context.machine_gate.result.exit_code == 0)
        next: create_pr
      - condition: when(true)
        next: fix_machine_gate
  - name: aislop_gate
    description: aislop の警告以上の指摘を受け入れ一覧と照合し、一覧に無ければ失敗する機械ゲート
    mode: system
    system_inputs:
      - type: command
        as: result
        command: npm ci && node scripts/aislop-check-bootstrap.mjs check
        timeout_ms: 900000
    rules:
      - condition: when(context.aislop_gate.result.exit_code == 0)
        next: COMPLETE
      - condition: when(true)
        next: fix_aislop_gate
  - name: fix_machine_gate
    description: make done の出力を確認して失敗した検査を修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make done が失敗しました。次の出力の失敗している検査（整形・clippy・テスト・型検査・lint）を修正してください。
        --- make done の stdout ---
        {context:machine_gate.result.stdout}
        --- make done の stderr ---
        {context:machine_gate.result.stderr}
    rules:
      - condition: make done の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: ABORT
  - name: create_pr
    description: 成果を commit / push し、PR を作成して Status を In Review にする（Status の失敗は非致命）
    mode: system
    system_inputs:
      - type: command
        as: commit
        command: |
          python3 tools/project-status/publish.py commit
        timeout_ms: 120000
      - type: command
        as: push
        command: |
          python3 tools/project-status/publish.py push
        timeout_ms: 120000
      - type: command
        as: pr
        command: |
          python3 tools/project-status/publish.py pr
        timeout_ms: 120000
      - type: command
        as: status
        command: |
          python3 tools/project-status/publish.py status --status "In Review" --require-published
        timeout_ms: 120000
    rules:
      - condition: when(context.create_pr.commit.exit_code == 0 && context.create_pr.push.exit_code == 0 && context.create_pr.pr.exit_code == 0)
        next: aislop_gate
      - condition: when(true)
        next: fix_publish
  - name: fix_publish
    description: 公開の失敗を確認して修正し、公開ステップまたは機械ゲートからやり直す
    capabilities: edit
    edit: true
    persona: coder
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        公開（commit / push / PR 作成 / Status 更新）が失敗しました。次の出力から失敗した段階を特定し、原因を修正してください。
        --- commit の stdout ---
        {context:create_pr.commit.stdout}
        --- push の stdout ---
        {context:create_pr.push.stdout}
        --- push の stderr ---
        {context:create_pr.push.stderr}
        --- PR 作成の stdout ---
        {context:create_pr.pr.stdout}
        --- Status 更新の stderr ---
        {context:create_pr.status.stderr}
    rules:
      - condition: 公開の失敗を修正して再試行する
        next: create_pr
      - condition: コードを修正して機械ゲートからやり直す
        next: machine_gate
  - name: fix_aislop_gate
    description: aislop の警告以上の指摘を修正するか、理由を述べて受け入れ一覧へ登録し、検証してから機械ゲートへ戻る
    capabilities: edit
    edit: true
    instruction:
      - aislop の指摘を直す
      - |
        次の aislop の判定を確認してください。指摘は修正するか、理由を述べて
        scripts/aislop-accepted.json へ登録してください。
        {context:aislop_gate.result.stdout}
        {context:aislop_gate.result.stderr}
    rules:
      - condition: aislop の指摘を修正または受け入れ一覧へ登録し、検証した
        next: machine_gate
      - condition: 修正できない
        next: ABORT
