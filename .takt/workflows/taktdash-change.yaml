name: taktdash-change
description: >-
  taktDash の変更作業の標準ワークフロー。builtin の development-core に
  taktdash-rules の知識を注入して計画・実装・レビュー・修正を行う。
  develop の後、整形・clippy・テスト・型検査・lint を make done で
  判定する機械ゲートの固定ステップを回す。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction
    - ref: taktdash-coding-rules
      position: before_instruction
max_steps: 70
initial_step: set_in_progress
steps:
  - name: set_in_progress
    description: タスクの指示文から対象 issue を特定し、ボードの Status を作業開始の In Progress へ変更する
    mode: system
    system_inputs:
      - type: command
        as: status
        timeout_ms: 300000
        command: |
          context=$(dirname "$(dirname "$(dirname "${TAKT_PREVIOUS_RESPONSE_FILE:-}")")")
          order="$context/task/order.md"
          if [ -z "${TAKT_PREVIOUS_RESPONSE_FILE:-}" ] || [ ! -f "$order" ]; then
            echo "未実施: タスクの指示文（order.md）を特定できないため Status を変更しません"
            exit 0
          fi
          ref=$(grep -oiE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+' "$order" | head -n 1)
          if [ -z "$ref" ]; then
            ref=$(grep -oiE 'issue[[:space:]]*#?[[:space:]]*[0-9]+' "$order" | grep -oE '[0-9]+' | head -n 1)
          fi
          if [ -z "$ref" ]; then
            ref=$(grep -oiE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/[0-9]+' "$order" | head -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "未実施: $order に issue の記述が見つからないため Status を変更しません"
            exit 0
          fi
          python3 tools/project-status/project_status.py --issue "$ref" --status "In Progress"
    rules:
      - condition: when(true)
        next: develop
  - name: develop
    description: development-core で計画・テスト作成・実装・レビュー・修正・要件確認を行う
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      review_policy_additions: []
      review_policy:
        - coding
        - testing
        - review
        - architecture
      plan_knowledge:
        - architecture
        - task-decomposition
        - taktdash-rules
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      development_knowledge:
        - architecture
        - implementation-semantics
        - taktdash-rules
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      security_review_knowledge_additions:
        - taktdash-rules
    rules:
      - condition: COMPLETE
        next: machine_gate
      - condition: ABORT
        next: ABORT
  - name: create_pr
    description: 対象 issue を特定してプルリクエストを作成し、ボードの Status を In Review へ変更する
    mode: system
    system_inputs:
      - type: command
        as: publish
        timeout_ms: 300000
        command: |
          if [ -z "${HOME:-}" ]; then
            HOME=$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')
            export HOME
          fi
          run_name=workflow-result
          if [ -n "${TAKT_PREVIOUS_RESPONSE_FILE:-}" ]; then
            context=$(dirname "$(dirname "$(dirname "$TAKT_PREVIOUS_RESPONSE_FILE")")")
            run_name=$(basename "$(dirname "$context")")
          fi
          git add -A
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit --no-verify -m "takt: $run_name"
          else
            echo "コミットする変更はありません"
          fi
          git push -u origin "$(git rev-parse --abbrev-ref HEAD)"
      - type: command
        as: pr
        timeout_ms: 300000
        command: |
          if [ -z "${HOME:-}" ]; then
            HOME=$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')
            export HOME
          fi
          gh pr create --base main --head "$(git rev-parse --abbrev-ref HEAD)" --fill
      - type: command
        as: review
        timeout_ms: 300000
        command: |
          context=$(dirname "$(dirname "$(dirname "${TAKT_PREVIOUS_RESPONSE_FILE:-}")")")
          order="$context/task/order.md"
          if [ -z "${TAKT_PREVIOUS_RESPONSE_FILE:-}" ] || [ ! -f "$order" ]; then
            echo "未実施: タスクの指示文（order.md）を特定できないため Status を変更しません"
            exit 0
          fi
          ref=$(grep -oiE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+' "$order" | head -n 1)
          if [ -z "$ref" ]; then
            ref=$(grep -oiE 'issue[[:space:]]*#?[[:space:]]*[0-9]+' "$order" | grep -oE '[0-9]+' | head -n 1)
          fi
          if [ -z "$ref" ]; then
            ref=$(grep -oiE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/[0-9]+' "$order" | head -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "未実施: $order に issue の記述が見つからないため Status を変更しません"
            exit 0
          fi
          python3 tools/project-status/project_status.py --issue "$ref" --status "In Review"
    rules:
      - condition: when(true)
        next: COMPLETE
  - name: machine_gate
    description: make done（整形・clippy・テスト・型検査・lint）をdevelop の成果に対して実行し、すべて通るときだけ完了とする
    mode: system
    system_inputs:
      - type: command
        as: result
        command: make done
        timeout_ms: 1800000
    rules:
      - condition: when(context.machine_gate.result.exit_code == 0)
        next: create_pr
      - condition: when(true)
        next: fix_machine_gate
  - name: fix_machine_gate
    description: make done の出力を確認して失敗した検査を修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make done が失敗しました。次の出力の失敗している検査（整形・clippy・テスト・型検査・lint）を修正してください。
        --- make done の stdout ---
        {context:machine_gate.result.stdout}
        --- make done の stderr ---
        {context:machine_gate.result.stderr}
    rules:
      - condition: make done の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: ABORT
