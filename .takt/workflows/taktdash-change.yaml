name: taktdash-change
description: >-
  taktDash の変更作業の標準ワークフロー。builtin の development-core に
  taktdash-rules の知識を注入して計画・実装・レビュー・修正を行う。
  develop の後、整形・clippy・テスト・型検査・lint を検査ごとに
  判定する機械ゲートの固定ステップを回す。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction
    - ref: taktdash-coding-rules
      position: before_instruction
# 判定も1工程として数える。従来の70工程で、最短6工程ごとに判定しても最大11回。
# 終わりの通知（notify_completed / notify_aborted）が1工程使うため、その分の1を足す。
max_steps: 82
initial_step: mark_in_progress
loop_monitors:
  # 修正対象が変わっても、同じ機械ゲートへ戻った周回を数える。
  - cycle: [machine_gate]
    ignore_steps:
      - fix_machine_gate_fmt
      - fix_machine_gate_clippy
      - fix_machine_gate_test
      - fix_machine_gate_typecheck
      - fix_machine_gate_lint
      - fix_machine_gate_proto_check
      - aislop_gate
      - fix_aislop_gate
    threshold: 3
    judge:
      persona: taktdash-loop-judge
      instruction: |
        機械検査から修正を経て機械検査に戻る経路を {cycle_count} 周しました。
        {report_dir} と同じ run の logs・context にある直近の検査出力と修正応答を時系列で読み、
        git diff とコミット履歴で実際の変更を確認してください。
        同じ指摘と原因が繰り返され、受け入れ条件に関係する差分、新しい検証結果、新たに確認した事実の
        いずれにも進展がないと確認できた場合は停止してください。修正したという報告や同じ失敗の再出力は
        進展の根拠に含めません。意味のある変化がある場合、または比較に足る証拠がない場合は続行してください。
        比較した指摘と、差分・検証・知見について判定の根拠を記録してください。
      rules:
        - condition: 進展あり、または比較の証拠が不足
          next: machine_gate
        - condition: 同じ指摘と原因が続き差分・検証結果・知見に進展がないと確認した
          next: notify_aborted
steps:
  - name: mark_in_progress
    description: 開始時に対象 issue を解決し、ボードの Status を In Progress にする（失敗は非致命）
    mode: system
    system_inputs:
      - type: command
        as: status
        command: |
          python3 tools/project-status/publish.py status --status "In Progress"
        timeout_ms: 120000
    rules:
      - condition: when(true)
        next: develop
  - name: develop
    description: development-core で計画・テスト作成・実装・レビュー・修正・要件確認を行う
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      review_policy_additions: []
      review_policy:
        - coding
        - testing
        - review
        - architecture
      plan_knowledge:
        - architecture
        - task-decomposition
        - taktdash-rules
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      development_knowledge:
        - architecture
        - implementation-semantics
        - taktdash-rules
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - taktdash-rules
      security_review_knowledge_additions:
        - taktdash-rules
    rules:
      - condition: COMPLETE
        next: machine_gate
      - condition: ABORT
        next: notify_aborted
  - name: machine_gate
    description: proto-check・fmt・clippy・test・typecheck・lint を検査ごとに実行し、すべて通るときだけ完了とする
    mode: system
    system_inputs:
      - type: command
        as: fmt
        command: "bash -o pipefail -c 'make fmt 2>&1 | tail -c 60000'"
        timeout_ms: 1800000
      - type: command
        as: clippy
        command: "bash -o pipefail -c 'make clippy 2>&1 | tail -c 60000'"
        timeout_ms: 1800000
      - type: command
        as: test
        command: "bash -c 'if [ ! -d frontend/web/node_modules ]; then bash -o pipefail -c \"npm --prefix frontend/web ci 2>&1 | tail -c 4000\" || exit $?; fi; bash -o pipefail -c \"make test 2>&1 | python3 tools/test-summary/test_summary.py --max-bytes 56000\"'"
        timeout_ms: 1800000
      - type: command
        as: typecheck
        command: "bash -o pipefail -c 'make typecheck 2>&1 | tail -c 60000'"
        timeout_ms: 1800000
      - type: command
        as: lint
        command: "bash -o pipefail -c 'make lint 2>&1 | tail -c 60000'"
        timeout_ms: 1800000
      - type: command
        as: proto_check
        command: "bash -o pipefail -c 'make proto-check 2>&1 | tail -c 60000'"
        timeout_ms: 1800000
    rules:
      - condition: when(context.machine_gate.fmt.exit_code != 0)
        next: fix_machine_gate_fmt
      - condition: when(context.machine_gate.clippy.exit_code != 0)
        next: fix_machine_gate_clippy
      - condition: when(context.machine_gate.test.exit_code != 0)
        next: fix_machine_gate_test
      - condition: when(context.machine_gate.typecheck.exit_code != 0)
        next: fix_machine_gate_typecheck
      - condition: when(context.machine_gate.lint.exit_code != 0)
        next: fix_machine_gate_lint
      - condition: when(context.machine_gate.proto_check.exit_code != 0)
        next: fix_machine_gate_proto_check
      - condition: when(context.machine_gate.proto_check.exit_code == 0 && context.machine_gate.fmt.exit_code == 0 && context.machine_gate.clippy.exit_code == 0 && context.machine_gate.test.exit_code == 0 && context.machine_gate.typecheck.exit_code == 0 && context.machine_gate.lint.exit_code == 0)
        next: aislop_gate
      - condition: when(true)
        next: notify_aborted
  - name: aislop_gate
    description: aislop の警告以上の指摘を受け入れ一覧と照合し、一覧に無ければ失敗する機械ゲート
    mode: system
    system_inputs:
      - type: command
        as: result
        command: npm ci && node scripts/aislop-check-bootstrap.mjs check
        timeout_ms: 900000
    rules:
      - condition: when(context.aislop_gate.result.exit_code == 0)
        next: notify_completed
      - condition: when(true)
        next: fix_aislop_gate
  - name: fix_machine_gate_fmt
    description: make fmt の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make fmt が失敗しました。次の出力の整形の失敗を修正してください。
        --- make fmt の stdout ---
        {context:machine_gate.fmt.stdout}
        --- make fmt の stderr ---
        {context:machine_gate.fmt.stderr}
    rules:
      - condition: make fmt の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_machine_gate_clippy
    description: make clippy の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make clippy が失敗しました。次の出力の clippy の警告とエラーを修正してください。
        --- make clippy の stdout ---
        {context:machine_gate.clippy.stdout}
        --- make clippy の stderr ---
        {context:machine_gate.clippy.stderr}
    rules:
      - condition: make clippy の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_machine_gate_test
    description: make test の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make test が失敗しました。次の出力のテストの失敗を修正してください。
        --- make test の stdout ---
        {context:machine_gate.test.stdout}
        --- make test の stderr ---
        {context:machine_gate.test.stderr}
    rules:
      - condition: make test の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_machine_gate_typecheck
    description: make typecheck の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make typecheck が失敗しました。次の出力の型検査の失敗を修正してください。
        --- make typecheck の stdout ---
        {context:machine_gate.typecheck.stdout}
        --- make typecheck の stderr ---
        {context:machine_gate.typecheck.stderr}
    rules:
      - condition: make typecheck の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_machine_gate_lint
    description: make lint の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make lint が失敗しました。次の出力の lint の指摘を修正してください。
        --- make lint の stdout ---
        {context:machine_gate.lint.stdout}
        --- make lint の stderr ---
        {context:machine_gate.lint.stderr}
    rules:
      - condition: make lint の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_machine_gate_proto_check
    description: make proto-check の失敗出力を確認して修正し、機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    policy: coding
    knowledge: taktdash-rules
    required_permission_mode: edit
    pass_previous_response: false
    instruction:
      - fix-supervisor
      - |
        make proto-check が失敗しました。次の出力の生成物と proto の不一致を修正してください。
        --- make proto-check の stdout ---
        {context:machine_gate.proto_check.stdout}
        --- make proto-check の stderr ---
        {context:machine_gate.proto_check.stderr}
    rules:
      - condition: make proto-check の失敗を修正して検証した
        next: machine_gate
      - condition: 裏付けられた原因を安全に修正または検証できない
        next: notify_aborted
  - name: fix_aislop_gate
    description: aislop の警告以上の指摘をコードの修正で解消し、検証してから機械ゲートへ戻る
    capabilities: edit
    edit: true
    persona: coder
    promotion:
      - at: 2
    instruction:
      - aislop の指摘を直す
      - |
        次の aislop の判定を確認してください。指摘はコードを修正して解消してください。
        scripts/aislop-accepted.json のエントリを追加・変更してはなりません。
        受け入れ一覧への追加には、窓口の承認と、解消を追跡する issue の番号
        （https://github.com/j5ik2o/takt-dash/issues/<番号>）が必須です。run が自分で追加してはなりません。
        受け入れは解消までの一時措置です。解消 issue が閉じたら、そのエントリを削除してください。
        修正で解消できない場合は、一覧を変えずに ABORT へ進み、理由を報告してください。
        {context:aislop_gate.result.stdout}
        {context:aislop_gate.result.stderr}
    rules:
      - condition: aislop の指摘をコードの修正で解消し、検証した
        next: machine_gate
      - condition: 修正できない
        next: notify_aborted
  # 終わりを Orca の担当ボットへ知らせる。通知は失敗しても終了コード 0 で、
  # 判定はどの結果でも元の行き先（COMPLETE / ABORT）へ進む。
  - name: notify_completed
    description: 成功で終わることを Orca の担当ボットへ知らせる（失敗は非致命）
    mode: system
    system_inputs:
      - type: command
        as: notify
        command: python3 .takt/scripts/notify_orca.py --result completed
        timeout_ms: 30000
    rules:
      - condition: when(true)
        next: COMPLETE
  - name: notify_aborted
    description: 失敗・中断で終わることを Orca の担当ボットへ知らせる（失敗は非致命）
    mode: system
    system_inputs:
      - type: command
        as: notify
        command: python3 .takt/scripts/notify_orca.py --result aborted
        timeout_ms: 30000
    rules:
      - condition: when(true)
        next: ABORT
